name: Build and Test Windows Application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Tests & Linting
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r WattanapatPDF/requirements.txt
        pip install pytest flake8 black

    - name: Lint with flake8 (Syntax Checks)
      run: |
        # ตรวจสอบ Error ร้ายแรงทางไวยากรณ์ (ถ้าเจอกลุ่มนี้จะสั่งหยุดทำงานทันที)
        flake8 WattanapatPDF/src --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Lint with flake8 (Style Checks)
      # ปรับให้ข้ามสเตปนี้ไปก่อน (ไม่สั่งพัง) หากเป็นแค่เรื่องการจัดฟอร์แมตเว้นวรรคไม่สวยงาม เพื่อยอมให้ไปรันเทสต่อได้
      continue-on-error: true 
      run: |
        flake8 WattanapatPDF/src --count --max-complexity=10 --max-line-length=127 --statistics

    - name: Run pytest (Unit Tests)
      env:
        PYTHONPATH: WattanapatPDF/src
      run: |
        # รันการทดสอบระบบและบันทึกรายงานผลลัพธ์
        pytest WattanapatPDF/tests/ --junitxml=pytest-report.xml

    - name: Publish Test Report Summary
      uses: test-summary/action@v2
      with:
        paths: pytest-report.xml
      if: always() # สั่งให้สร้างรายงานสรุปเสมอไม่ว่าจะรันเทสผ่านหรือไม่ก็ตาม

  build:
    name: Build Windows Installer
    needs: test
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r WattanapatPDF/requirements.txt
        pip install pyinstaller

    - name: Execute Build Script
      shell: cmd
      run: |
        cd WattanapatPDF/installer
        call build_windows.bat

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wattanapat-pdf-installer
        path: |
          WattanapatPDF/installer/Output/*.exe
          WattanapatPDF/installer/dist/*.exe
        if-no-files-found: warn
