name: Build and Test Windows Application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Tests & Linting
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11" # แก้ไขจาก python-file เป็น python-version ให้ถูกต้อง
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r WattanapatPDF/requirements.txt
        pip install pytest flake8 black

    - name: Lint with flake8
      run: |
        flake8 WattanapatPDF/src --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 WattanapatPDF/src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run pytest
      env:
        PYTHONPATH: WattanapatPDF/src
      run: |
        pytest WattanapatPDF/tests/

  build:
    name: Build Windows Installer
    needs: test
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11" # ตรวจสอบให้มั่นใจว่าเป็น python-version ทั้งสองจ็อบ
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r WattanapatPDF/requirements.txt
        pip install pyinstaller

    - name: Execute Build Script
      shell: cmd
      run: |
        cd WattanapatPDF/installer
        call build_windows.bat

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wattanapat-pdf-installer
        path: |
          WattanapatPDF/installer/Output/*.exe
          WattanapatPDF/installer/dist/*.exe
        if-no-files-found: warn
