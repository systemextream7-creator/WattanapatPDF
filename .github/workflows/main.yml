name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # เช็คทั้งพาธชั้นนอกและชั้นในเพื่อความชัวร์ในการลง dependencies
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
        if (Test-Path WattanapatPDF/requirements.txt) { pip install -r WattanapatPDF/requirements.txt }

    # [ปรับปรุงขั้นตอนนี้] เพิ่มการนำทางเข้าโฟลเดอร์ชั้นใน WattanapatPDF ก่อนสั่งรันสคริปต์
    - name: Build Executable & Installer
      run: |
        cd WattanapatPDF
        cd installer
        .\build_windows.bat
      shell: cmd

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WattanapatPDF-Windows-Installer
        path: |
          WattanapatPDF/installer/dist/
          WattanapatPDF/dist/
          WattanapatPDF/*.exe
          WattanapatPDF/installer/*.exe
          *.exe
        if-no-files-found: warn
