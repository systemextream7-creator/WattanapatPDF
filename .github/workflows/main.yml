name: Build and Test Windows Application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Tests & Linting
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-file: "3.11" # หรือระบุเวอร์ชันของ Python ที่คุณใช้งานอยู่
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r WattanapatPDF/requirements.txt
        pip install pytest flake8 black # ติดตั้งเครื่องมือสำหรับรัน test และจัดฟอร์แมตโค้ด

    - name: Lint with flake8
      run: |
        # ตรวจสอบมาตรฐานของโค้ด (สามารถปรับแต่งกฎได้ตามต้องการ)
        flake8 WattanapatPDF/src --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 WattanapatPDF/src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run pytest
      env:
        PYTHONPATH: WattanapatPDF/src
      run: |
        # รันไฟล์ทดสอบทั้งหมดที่อยู่ในโฟลเดอร์ tests
        pytest WattanapatPDF/tests/

  build:
    name: Build Windows Installer
    needs: test # จะเริ่มทำงานก็ต่อเมื่อผ่านขั้นตอนการทดสอบ (test) เรียบร้อยแล้วเท่านั้น
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r WattanapatPDF/requirements.txt
        pip install pyinstaller # มั่นใจว่ามี pyinstaller สำหรับคอมไพล์โค้ด

    - name: Execute Build Script
      shell: cmd
      run: |
        cd WattanapatPDF/installer
        call build_windows.bat

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wattanapat-pdf-installer
        path: |
          WattanapatPDF/installer/Output/*.exe
          WattanapatPDF/installer/dist/*.exe
        if-no-files-found: warn
