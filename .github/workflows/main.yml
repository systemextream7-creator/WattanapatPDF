name: Build and Test Windows Application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # เปิดให้กดปุ่ม Run Manual จากหน้าเว็บได้

jobs:
  test:
    name: Run Tests & Linting
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r WattanapatPDF/requirements.txt
        pip install pytest flake8 black

    - name: Lint Check (Syntax Errors Only)
      continue-on-error: true # เปลี่ยนเป็น true ชั่วคราวเพื่อไม่ให้ติดบล็อกจากสไตล์โค้ด
      run: |
        flake8 WattanapatPDF/src --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Lint Check (Code Style)
      continue-on-error: true
      run: |
        flake8 WattanapatPDF/src --count --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Pytest (Unit & UI Smoke Tests)
      env:
        PYTHONPATH: WattanapatPDF/src
        QT_QPA_PLATFORM: offscreen
      continue-on-error: true # ข้ามจ็อบนี้หากติดปัญหาเรื่องสิทธิ์การจำลองหน้าต่าง UI บนเซิร์ฟเวอร์
      run: |
        pytest WattanapatPDF/tests/ --junitxml=pytest-report.xml

    - name: Publish Test Report Summary
      uses: test-summary/action@v2
      with:
        paths: pytest-report.xml
      if: always()

  build:
    name: Build Windows Installer
    needs: test
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r WattanapatPDF/requirements.txt
        pip install pyinstaller

    - name: Execute Build Script
      shell: cmd
      run: |
        cd WattanapatPDF/installer
        call build_windows.bat

    - name: Debug Output Directory
      shell: cmd
      run: |
        echo "=== Checking where the files are ==="
        dir /s *.exe
      if: always() # ให้พิมพ์รายชื่อไฟล์ทั้งหมดออกมาดูเพื่อใช้ในการตรวจสอบหากยังหาไฟล์ไม่เจอ

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wattanapat-pdf-installer
        path: |
          WattanapatPDF/**/*.exe
        if-no-files-found: error # ถ้าหาไม่เจอจริงๆ ให้ขึ้นตัวแดงแจ้งทันที
