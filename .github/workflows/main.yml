name: Build Windows installer

on:
  workflow_dispatch: # เปิดปุ่มสีฟ้าสำหรับกดรันด้วยตัวเอง
  push:
    branches: [ "main" ] # รันอัตโนมัติเมื่อมีการ push โค้ดลงสาขา main

jobs:
  build:
    runs-on: windows-latest # ใช้เซิร์ฟเวอร์ระบบปฏิบัติการ Windows

    steps:
    # 1. ดึงโค้ดโปรเจกต์ลงเซิร์ฟเวอร์
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. ตั้งค่าระบบ Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # 3. ติดตั้ง Dependencies และตัวสร้าง Executable (PyInstaller)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    # 4. ติดตั้ง Inno Setup (จำเป็นมากสำหรับสคริปต์ .iss ของคุณ)
    - name: Install Inno Setup
      run: choco install innosetup -y

    # 5. เรียกใช้งานไฟล์ Batch Script สำหรับบิวด์ของโปรเจกต์
    - name: Build Executable & Installer
      run: |
        cd installer
        .\build_windows.bat
      shell: cmd

    # 6. รวบรวมไฟล์ติดตั้งส่งออกไปยังระบบดาวน์โหลด Artifacts
    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WattanapatPDF-Windows-Installer
        path: |
          installer/dist/
          dist/
          *.exe
          installer/*.exe
        if-no-files-found: warn
